# Sitio Next.js estático servido por nginx sin privilegios (puerto 8080). Reenvía /api a la API, así también
# funciona con «kubectl port-forward» sin Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bf.nombre" . }}-web
  labels:
    {{- include "bf.etiquetas" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "bf.selector" (dict "ctx" . "componente" "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bf.nombre" . }}-web
  labels:
    {{- include "bf.etiquetas" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "bf.selector" (dict "ctx" . "componente" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bf.etiquetas" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "bf.nombre" . }}
      automountServiceAccountToken: false
      {{- include "bf.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "bf.seguridadPod" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: {{ include "bf.imagenWeb" . }}
          imagePullPolicy: {{ .Values.imagenes.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: {{ printf "http://%s-api.%s.svc.cluster.local:8000" (include "bf.nombre" .) .Release.Namespace | quote }}
            - name: DNS_RESOLVER
              value: {{ .Values.web.dnsResolver | quote }}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.recursos | nindent 12 }}
          securityContext:
            {{- include "bf.seguridadContenedor" . | nindent 12 }}
          volumeMounts:
            # nginx escribe la configuración generada y sus temporales: el resto del disco es de solo lectura.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
