{{- if .Values.mailhog.enabled }}
# Buzón de pruebas: atrapa los correos (recordatorios, confirmaciones). Interfaz web en el puerto 8025.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bf.nombre" . }}-mailhog
  labels:
    {{- include "bf.etiquetas" . | nindent 4 }}
    app.kubernetes.io/component: mailhog
spec:
  selector:
    {{- include "bf.selector" (dict "ctx" . "componente" "mailhog") | nindent 4 }}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: web, port: 8025, targetPort: 8025}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bf.nombre" . }}-mailhog
  labels:
    {{- include "bf.etiquetas" . | nindent 4 }}
    app.kubernetes.io/component: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bf.selector" (dict "ctx" . "componente" "mailhog") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bf.etiquetas" . | nindent 8 }}
        app.kubernetes.io/component: mailhog
    spec:
      serviceAccountName: {{ include "bf.nombre" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "bf.seguridadPod" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mailhog
          image: {{ .Values.mailhog.imagen }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: web, containerPort: 8025}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            {{- include "bf.seguridadContenedor" . | nindent 12 }}
{{- end }}
