imagen: grafana/otel-lgtm:0.8.1
# Solo para laboratorio: en producción se usaría almacenamiento persistente y usuarios de Grafana reales.
persistencia:
  enabled: false
  tamano: 5Gi
recursos:
  requests: {cpu: 250m, memory: 768Mi}
  limits: {cpu: "1", memory: 1536Mi}
# Alertas de Grafana (grafana/alertas.yaml). Sin host SMTP se ven en Grafana › Alerting; con host también llegan por correo.
alertas:
  smtp:
    host: ""                 # p. ej. barberforge-mailhog.barberforge-dev.svc.cluster.local:1025
    remitente: grafana@barberforge.local
