# Solo para desarrollo local (docker compose up). Dokploy usa únicamente docker-compose.yml.
services:
  web:
    ports:
      - "8080:8080"
  mailhog:
    ports:
      - "8025:8025"
  # Publicado para que Minikube use este Ollama (http://host.minikube.internal:11434).
  bf-ollama:
    ports:
      - "11434:11434"
  # Feature 012: para probar el servicio de voz directo (http://localhost:8001/docs) y con el script de evaluación.
  bf-voz:
    ports:
      - "8001:8001"
  otel-lgtm:
    ports:
      - "3000:3000"   # Grafana (admin / admin)
      - "4318:4318"   # OTLP por HTTP
