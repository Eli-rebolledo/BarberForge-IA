services:
  bf-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barber}
      POSTGRES_DB: barber
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  # API FastAPI. Al arrancar aplica las migraciones de Alembic (alembic upgrade head).
  bf-api:
    build: ./codigo/backend
    environment:
      DB_HOST: bf-db
      DB_USER: barber
      DB_NAME: barber
      DB_PASSWORD: ${DB_PASSWORD:-barber}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OLLAMA_URL: http://bf-ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SEED_DEMO: ${SEED_DEMO:-true}
      MAILHOG_URL: ${MAILHOG_URL:-}
      BARBERIA_NOMBRE: ${BARBERIA_NOMBRE:-BarberForge Popayán}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Bogota}
      ENTORNO: ${ENTORNO:-local}
      # Predicción de inasistencias (feature 011)
      ML_ACTIVO: ${ML_ACTIVO:-true}
      ML_UMBRAL_RIESGO: ${ML_UMBRAL_RIESGO:-0.20}
      ML_MINIMO_REENTRENAMIENTO: ${ML_MINIMO_REENTRENAMIENTO:-200}
      # Observabilidad: vacío = apagada. Con «docker compose --profile observabilidad up» usa
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318 en el .env
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: barberforge-api
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    depends_on:
      bf-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  # Frontend Next.js exportado como sitio estático y servido por nginx, que reenvía /api a bf-api.
  web:
    build: ./codigo/frontend
    depends_on:
      - bf-api
    restart: unless-stopped

  # IA local. En el despliegue con Kubernetes (Minikube) se deja corriendo aquí, en Docker Desktop:
  #   docker compose up -d bf-ollama ollama-init
  bf-ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - bf-ollama
    environment:
      OLLAMA_HOST: http://bf-ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull $$LLM_MODEL"]
    restart: "no"

  # Feature 012 · asistente de voz (Whisper + intención con Ollama + API + Piper). Es opcional y pesado (~1,5 GB de
  # imagen, ~1 GB de RAM), por eso va en un perfil: docker compose --profile voz up -d --build
  # La web reenvía /voz/ a este contenedor; si no está levantado, el botón del micrófono avisa que no está disponible.
  bf-voz:
    build:
      context: ./codigo/voz
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
        PIPER_VOZ: ${PIPER_VOZ:-es_MX-claude-high}
    profiles: ["voz"]
    environment:
      API_URL: http://bf-api:8000
      OLLAMA_URL: http://bf-ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      INTENCION_CON_LLM: ${INTENCION_CON_LLM:-true}
      TTS_ACTIVO: ${TTS_ACTIVO:-true}
    depends_on:
      - bf-api
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped

  # Observabilidad (opcional): Grafana + Prometheus + Tempo + Loki + recolector OpenTelemetry en un contenedor,
  # igual que en el Laboratorio 3. Se levanta con: docker compose --profile observabilidad up -d
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.1
    profiles: ["observabilidad"]
    environment:
      # Las alertas de Grafana (plataforma/helm/observabilidad/grafana/alertas.yaml) llegan por correo a MailHog.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailhog:1025
      GF_SMTP_FROM_ADDRESS: grafana@barberforge.local
    volumes:
      - lgtm:/data
      # Mismo tablero y mismas alertas que en Kubernetes, cargados solos al arrancar.
      - ./plataforma/helm/observabilidad/grafana/tableros.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/barberforge.yaml:ro
      - ./plataforma/helm/observabilidad/dashboards/barberforge-slo.json:/var/lib/barberforge-dashboards/barberforge-slo.json:ro
      - ./plataforma/helm/observabilidad/grafana/alertas.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/barberforge.yaml:ro
    depends_on:
      - mailhog
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  lgtm:
