# CI/CD con controles DevSecOps y entrega GitOps.
#
#   develop / pull requests:  pruebas → validación de Kubernetes y OpenTofu → escaneos → construcción (sin publicar)
#   main:                     lo anterior → publicar imágenes (api, web, voz) en GHCR → SBOM → firma con Cosign
#                             → «gitops»: escribe el nuevo tag en values-dev.yaml → Argo CD lo despliega solo
name: ci-cd
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------- calidad ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: codigo/backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  # Feature 012: servicio de voz. Las pruebas simulan Whisper y Piper, así no se descargan modelos en el CI.
  voz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/voz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: codigo/voz/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: codigo/frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ---------- infraestructura: Helm, manifiestos de Kubernetes y OpenTofu ----------
  plataforma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Instalar kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: helm lint
        run: |
          helm lint plataforma/helm/barberforge -f plataforma/helm/barberforge/values-dev.yaml
          helm lint plataforma/helm/barberforge -f plataforma/helm/barberforge/values-staging.yaml
          helm lint plataforma/helm/observabilidad
          helm lint plataforma/argocd
      - name: Manifiestos válidos contra el esquema de Kubernetes (kubeconform)
        run: |
          for entorno in dev staging; do
            helm template barberforge plataforma/helm/barberforge -n barberforge-$entorno \
              -f plataforma/helm/barberforge/values-$entorno.yaml | kubeconform -strict -summary -kubernetes-version 1.31.0
          done
          helm template obs plataforma/helm/observabilidad | kubeconform -strict -summary
          helm template gitops plataforma/argocd -n argocd | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - uses: opentofu/setup-opentofu@v2
      - name: OpenTofu fmt + validate
        working-directory: plataforma/opentofu
        run: |
          tofu fmt -check -diff
          tofu init -backend=false
          tofu validate

  # ---------- seguridad del código y de la configuración ----------
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencias vulnerables y secretos expuestos (Trivy fs) — bloquea con CRÍTICAS
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Reporte de hallazgos ALTOS (no bloquea; se revisan en la bitácora docs/devsecops.md)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
      - name: Malas configuraciones en Dockerfiles, Helm y OpenTofu (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true

  # ---------- imágenes: construir, escanear, publicar, SBOM y firma ----------
  imagenes:
    needs: [backend, voz, frontend, plataforma, seguridad]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # publicar en ghcr.io
      id-token: write      # firma sin llaves de Cosign (identidad OIDC de GitHub)
    strategy:
      fail-fast: false
      matrix:
        componente: [api, web, voz]   # voz = feature 012 (Whisper + Piper), solo amd64: es pesada para emular ARM
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: |
          case "${{ matrix.componente }}" in
            web) contexto=codigo/frontend; plataformas=linux/amd64,linux/arm64 ;;
            voz) contexto=codigo/voz;      plataformas=linux/amd64,linux/arm64 ;;
            *)   contexto=codigo/backend;  plataformas=linux/amd64,linux/arm64 ;;
          esac
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/barberforge-${{ matrix.componente }}" >> "$GITHUB_ENV"
          echo "CONTEXTO=$contexto" >> "$GITHUB_ENV"
          echo "PLATAFORMAS=$plataformas" >> "$GITHUB_ENV"
      - name: Emulación para construir también la versión ARM64 (Mac con Apple Silicon)
        if: env.PUBLICAR == 'true'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construir (local, para escanear antes de publicar)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXTO }}
          load: true
          tags: ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
      - name: Vulnerabilidades de la imagen (Trivy image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Entrar a GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en GHCR
        if: env.PUBLICAR == 'true'
        id: publicar
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXTO }}
          platforms: ${{ env.PLATAFORMAS }}   # amd64 (Windows/Linux) y arm64 (Mac con chip M); la voz solo amd64
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.componente }}
      - name: SBOM (lista de todas las dependencias de la imagen) con Syft
        if: env.PUBLICAR == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGEN }}@${{ steps.publicar.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.componente }}.spdx.json
          artifact-name: sbom-${{ matrix.componente }}.spdx.json
      - uses: sigstore/cosign-installer@v4.1.3
        if: env.PUBLICAR == 'true'
      - name: Firmar la imagen y adjuntarle el SBOM (Cosign, sin llaves)
        if: env.PUBLICAR == 'true'
        env:
          REF: ${{ env.IMAGEN }}@${{ steps.publicar.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.componente }}.spdx.json "$REF"
      - name: Verificar la firma (solo pasa si la imagen salió de ESTE pipeline)
        if: env.PUBLICAR == 'true'
        run: |
          cosign verify "${IMAGEN}@${{ steps.publicar.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Firma verificada para ${IMAGEN}@${{ steps.publicar.outputs.digest }}"

  # ---------- GitOps: Git es la fuente de verdad; Argo CD aplica lo que diga values-dev.yaml ----------
  gitops:
    needs: imagenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-main
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Apuntar dev a las imágenes nuevas
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.imagenes.api.tag = strenv(TAG) | .imagenes.web.tag = strenv(TAG) | .imagenes.voz.tag = strenv(TAG)' \
            plataforma/helm/barberforge/values-dev.yaml
          git diff --stat
      - name: Commit del cambio de versión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plataforma/helm/barberforge/values-dev.yaml
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "chore(gitops): dev usa las imágenes ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main

  # ---------- despliegue opcional en Dokploy (Laboratorio 4), solo si existe el secreto ----------
  dokploy:
    needs: imagenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "Sin DOKPLOY_WEBHOOK_URL: se omite Dokploy (el despliegue principal es Argo CD)."; exit 0; fi
          curl -fsS -X POST "$WEBHOOK"
