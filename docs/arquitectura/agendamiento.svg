<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1000" viewBox="0 0 1880 1000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="30" width="1840" height="400" rx="14" fill="none" stroke="#2E7D32" stroke-width="2.6"/><text x="34" y="396" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#2E7D32">Cliente</text><text x="34" y="418" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" fill="#2E7D32">[Web, chat o voz]</text><rect x="20" y="460" width="1840" height="340" rx="14" fill="none" stroke="#6FA0DA" stroke-width="2.6"/><text x="34" y="766" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E64B4">Sistema</text><text x="34" y="788" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" fill="#1E64B4">[API, base de datos y modelo ML]</text><path d="M205,310 L205,520" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M575,310 L575,520" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M945,310 L945,520" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M1315,310 L1315,520" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M370,570 L410,250" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M740,570 L780,250" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M1110,570 L1150,250" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M1210,520 L1210,310" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M1480,640 L1520,640" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><path d="M1570,520 L1570,310" fill="none" stroke="#555555" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#ah)"/><rect x="40" y="90" width="330" height="220" rx="10" fill="white" stroke="#2E7D32" stroke-width="2.6"/><text x="205.0" y="152.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2E7D32" text-anchor="middle">1. Inicia sesión</text><text x="205.0" y="181.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="middle">[Cliente]</text><text x="205.0" y="213.7" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">o se registra: nombre,</text><text x="205.0" y="240.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">correo, clave y acepta</text><text x="205.0" y="268.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">la política de datos</text><rect x="410" y="90" width="330" height="220" rx="10" fill="white" stroke="#2E7D32" stroke-width="2.6"/><text x="575.0" y="180.1" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2E7D32" text-anchor="middle">3. Elige servicios</text><text x="575.0" y="209.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="middle">[Cliente]</text><text x="575.0" y="240.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">uno o varios (combo)</text><rect x="780" y="90" width="330" height="220" rx="10" fill="white" stroke="#2E7D32" stroke-width="2.6"/><text x="945.0" y="166.5" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2E7D32" text-anchor="middle">5. Elige barbero</text><text x="945.0" y="195.4" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="middle">[Cliente]</text><text x="945.0" y="227.3" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">ve sus especialidades y</text><text x="945.0" y="254.4" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">su foto en grande</text><rect x="1150" y="90" width="330" height="220" rx="10" fill="white" stroke="#2E7D32" stroke-width="2.6"/><text x="1315.0" y="166.5" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2E7D32" text-anchor="middle">7. Elige día y hora</text><text x="1315.0" y="195.4" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="middle">[Cliente]</text><text x="1315.0" y="227.3" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">de las horas libres que</text><text x="1315.0" y="254.4" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">le muestra el sistema</text><rect x="1520" y="90" width="330" height="220" rx="10" fill="white" stroke="#2E7D32" stroke-width="2.6"/><text x="1685.0" y="152.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2E7D32" text-anchor="middle">10. Recibe el correo</text><text x="1685.0" y="181.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="middle">[Cliente]</text><text x="1685.0" y="213.7" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">«Tu cita en…»: queda</text><text x="1685.0" y="240.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">Pendiente hasta</text><text x="1685.0" y="268.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#2E7D32" text-anchor="middle">confirmar</text><rect x="40" y="520" width="330" height="220" rx="10" fill="white" stroke="#1E64B4" stroke-width="2.6"/><text x="205.0" y="582.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E64B4" text-anchor="middle">2. Valida la sesión</text><text x="205.0" y="611.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E64B4" text-anchor="middle">[Sistema]</text><text x="205.0" y="643.7" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">token JWT y rol: solo un</text><text x="205.0" y="670.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">cliente agenda para sí</text><text x="205.0" y="698.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">mismo</text><rect x="410" y="520" width="330" height="220" rx="10" fill="white" stroke="#1E64B4" stroke-width="2.6"/><text x="575.0" y="582.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E64B4" text-anchor="middle">4. Filtra barberos</text><text x="575.0" y="611.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E64B4" text-anchor="middle">[Sistema]</text><text x="575.0" y="643.7" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">activos y que hacen</text><text x="575.0" y="670.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">todos los servicios</text><text x="575.0" y="698.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">elegidos</text><rect x="780" y="520" width="330" height="220" rx="10" fill="white" stroke="#1E64B4" stroke-width="2.6"/><text x="945.0" y="567.6" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E64B4" text-anchor="middle">6. Calcula horas</text><text x="945.0" y="598.3" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E64B4" text-anchor="middle">libres</text><text x="945.0" y="627.2" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E64B4" text-anchor="middle">[Sistema]</text><text x="945.0" y="659.1" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">días de trabajo,</text><text x="945.0" y="686.2" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">festivos, ausencias,</text><text x="945.0" y="713.3" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">citas y duración</text><rect x="1150" y="520" width="330" height="220" rx="10" fill="white" stroke="#1E64B4" stroke-width="2.6"/><text x="1315.0" y="582.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E64B4" text-anchor="middle">8. Revalida la hora</text><text x="1315.0" y="611.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E64B4" text-anchor="middle">[Sistema]</text><text x="1315.0" y="643.7" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">índice único: dos</text><text x="1315.0" y="670.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">personas no toman la</text><text x="1315.0" y="698.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">misma hora</text><rect x="1520" y="520" width="330" height="220" rx="10" fill="white" stroke="#1E64B4" stroke-width="2.6"/><text x="1685.0" y="582.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E64B4" text-anchor="middle">9. Crea la cita</text><text x="1685.0" y="611.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E64B4" text-anchor="middle">[Sistema]</text><text x="1685.0" y="643.7" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">Pendiente; calcula el</text><text x="1685.0" y="670.9" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">riesgo (ML) y envía el</text><text x="1685.0" y="698.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#1E64B4" text-anchor="middle">correo</text><text x="1595" y="345" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#2E7D32" text-anchor="start">→ Sigue el ciclo de</text><text x="1595" y="370" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="start">recordatorios y confirmación</text><text x="1595" y="395" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#2E7D32" text-anchor="start">(−60, −40 y −15 min)</text><text x="40" y="850" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#333333" text-anchor="start">En el local, el barbero o el administrador agenda para un cliente con o sin cuenta: se salta 1-2 y la cita queda Confirmada. Por chat o voz, el asistente ofrece los mismos pasos como botones.</text><text x="30" y="930" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#222222" text-anchor="start">Flujo de agendamiento: de la solicitud a la cita</text><text x="30" y="958" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#666666" text-anchor="start">Diagrama de actividad con carriles: los números indican el orden; el paso 8 evita la doble reserva</text><rect x="1095.0" y="354.51" width="230" height="50.98" fill="white" opacity="0.92"/><text x="1210" y="375.8" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#333333" text-anchor="middle">Si otro la tomó: ofrece</text><text x="1210" y="397.0" font-family="FreeSans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#333333" text-anchor="middle">3 horas cercanas</text></svg>